name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/DontNameYourBabyIs-FE/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/DontNameYourBabyIs-FE

      - name: Build frontend
        run: npm run build
        working-directory: frontend/DontNameYourBabyIs-FE
        env:
          GITHUB_PAGES: 'true'
          API_BASE_URL: ${{ vars.API_BASE_URL }}

      - name: Add the HTML entry point
        run: cp public/index.html dist/index.html
        working-directory: frontend/DontNameYourBabyIs-FE

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/DontNameYourBabyIs-FE/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
